<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SRK Men's Clothing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 32px 26px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo img {
            width: 90px;
            max-width: 100%;
        }

        h1 {
            text-align: center;
            margin: 10px 0 8px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 26px;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 16px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #111;
            font-weight: 700;
            text-decoration: none;
        }

        .flash {
            background: #f1f1f1;
            border-radius: 9px;
            padding: 10px 12px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .login-box {
                padding: 26px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img
            src="{{ url_for('static', filename='images/srk-logo.png') }}"
            alt="SRK Men's Clothing"
        >
    </div>

    <h1>Welcome Back</h1>

    <div class="subtitle">
        Login to track your SRK orders.
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label for="identifier">
            Email or Mobile Number
        </label>

        <input
            type="text"
            id="identifier"
            name="identifier"
            placeholder="Email or mobile number"
            autocomplete="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="{{ url_for('customer_register') }}">
            Create Account
        </a>
    </div>

</div>

</body>
</html>
