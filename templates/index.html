<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SRK Men's Clothing</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    color: #111;
}

/* HEADER */

header {
    background: #050505;
    color: white;
    padding: 10px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #222;
}

.logo img {
    width: 95px;
    height: 55px;
    object-fit: contain;
}

.cart-button {
    background: white;
    color: #050505;
    border: 0;
    padding: 11px 19px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.cart-button:hover {
    transform: translateY(-2px);
}

/* HERO */

.hero {
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        #111;
    color: white;
    text-align: center;
    padding: 95px 20px 105px;
}

.hero p:first-child {
    letter-spacing: 4px;
    font-size: 13px;
    font-weight: bold;
}

.hero h1 {
    font-size: clamp(42px, 9vw, 82px);
    line-height: 1;
    margin: 20px 0;
    letter-spacing: -2px;
}

.hero p {
    color: #ccc;
    font-size: 16px;
}

.shop-btn {
    display: inline-block;
    background: white;
    color: #050505;
    padding: 14px 30px;
    margin-top: 20px;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    transition: .2s;
}

.shop-btn:hover {
    transform: translateY(-2px);
}

/* SHOP */

.shop {
    max-width: 1200px;
    margin: auto;
    padding: 55px 20px;
}

.shop h2 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 25px;
}

/* SEARCH */

.search {
    display: block;
    width: 100%;
    max-width: 600px;
    margin: 25px auto;
    padding: 15px 18px;
    border: 1px solid #ddd;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
    background: white;
}

.search:focus {
    border-color: #111;
}

/* CATEGORIES */

.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    margin: 28px 0 35px;
}

.category-btn {
    padding: 10px 19px;
    background: white;
    color: #111;
    border: 1px solid #ccc;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 600;
    transition: .2s;
}

.category-btn:hover {
    background: #111;
    color: white;
    border-color: #111;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 24px;
}

.product {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 18px rgba(0,0,0,.07);
    transition: transform .2s, box-shadow .2s;
}

.product:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

/* PRODUCT IMAGES */

.gallery {
    position: relative;
    width: 100%;
    height: 320px;
    overflow: hidden;
    background: #eee;
}

.gallery-track {
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
}

.gallery-track::-webkit-scrollbar {
    display: none;
}

.gallery-track img {
    width: 100%;
    min-width: 100%;
    height: 100%;
    object-fit: cover;
    scroll-snap-align: start;
}

/* PHOTO COUNT */

.photo-count {
    position: absolute;
    right: 12px;
    top: 12px;
    background: rgba(0,0,0,.7);
    color: white;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
}

/* PRODUCT INFO */

.product-info {
    padding: 20px;
}

.product-info h3 {
    margin: 0 0 8px;
    font-size: 19px;
}

.price {
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0 15px;
}

/* SIZE */

.size {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: white;
    font-size: 15px;
}

/* ADD TO CART */

.add {
    width: 100%;
    margin-top: 11px;
    padding: 14px;
    border: 0;
    background: #111;
    color: white;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.add:hover {
    background: #333;
}

/* CART */

.cart-box {
    display: none;
    position: fixed;
    right: 15px;
    top: 80px;
    width: min(420px, calc(100% - 30px));
    max-height: 85vh;
    overflow-y: auto;
    background: white;
    padding: 24px;
    border-radius: 15px;
    box-shadow: 0 8px 35px rgba(0,0,0,.3);
    z-index: 200;
}

.cart-box.show {
    display: block;
}

.cart-item {
    padding: 14px 0;
    border-bottom: 1px solid #ddd;
}

.quantity button {
    padding: 6px 11px;
    margin: 5px;
}

/* CHECKOUT */

.checkout input,
.checkout textarea {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

.checkout textarea {
    min-height: 90px;
}

/* WHATSAPP */

.whatsapp {
    width: 100%;
    padding: 15px;
    background: #25D366;
    color: white;
    border: 0;
    border-radius: 7px;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
}

/* FOOTER */

footer {
    margin-top: 50px;
    padding: 40px 20px;
    background: #050505;
    color: white;
    text-align: center;
}

footer p {
    color: #aaa;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 8px 15px;
    }

    .logo img {
        width: 80px;
        height: 50px;
    }

    .cart-button {
        padding: 10px 14px;
    }

    .hero {
        padding: 75px 15px 85px;
    }

    .hero h1 {
        font-size: 43px;
    }

    .shop {
        padding: 40px 15px;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .gallery {
        height: 235px;
    }

    .product-info {
        padding: 13px;
    }

    .product-info h3 {
        font-size: 16px;
    }

    .price {
        font-size: 18px;
    }

    .size {
        padding: 10px;
    }

    .add {
        padding: 12px 8px;
        font-size: 13px;
    }
}

</style>

</head>


<body>


<header>

<div class="logo">

<img
src="{{ url_for('static', filename='images/srk-logo.png') }}"
alt="SRK">

</div>

<button
class="cart-button"
onclick="toggleCart()">

🛒 Cart
(<span id="cart-count">0</span>)

</button>

</header>


<section class="hero">

<p>SRK MEN'S CLOTHING</p>

<h1>WEAR A BETTER YOU</h1>

<p>
Style • Comfort • Confidence
</p>

<a href="#shop"
class="shop-btn">

SHOP NOW

</a>

</section>


<section
class="shop"
id="shop">

<h2>Our Collection</h2>


<input
class="search"
id="search"
placeholder="🔍 Search products..."
oninput="displayProducts()">


<div class="categories">

<button
class="category-btn"
onclick="setCategory('All')">

All

</button>

{% for category in categories %}

<button
class="category-btn"
onclick="setCategory('{{ category }}')">

{{ category }}

</button>

{% endfor %}

</div>


<div
class="products"
id="products">

</div>

</section>


<div
class="cart-box"
id="cart">

<h2>🛒 Your Cart</h2>

<div id="cart-items"></div>

<h3>
Total: ₹<span id="total">0</span>
</h3>


<div class="checkout">
<h3>Delivery Details</h3>

<input
id="customer-name"
placeholder="Full Name">

<input
id="customer-phone"
type="tel"
placeholder="Phone Number">

<textarea
id="customer-address"
placeholder="Complete Delivery Address"></textarea>

<button
class="whatsapp"
onclick="orderWhatsApp()">

🟢 ORDER ON WHATSAPP

</button>

</div>

</div>


<footer>

<h2>SRK</h2>

<p>MEN'S CLOTHING</p>

<p>
Style • Comfort • Confidence
</p>

</footer>


<script>

const products =
{{ products | tojson }};

let cart = [];

let selectedCategory = "All";


function setCategory(category) {

selectedCategory = category;

displayProducts();

}


function displayProducts() {

const container =
document.getElementById("products");

const search =
document.getElementById("search")
.value
.toLowerCase();

container.innerHTML = "";


const filtered =
products.filter(product => {

const nameMatch =
product.name
.toLowerCase()
.includes(search);

const categoryMatch =
selectedCategory === "All" ||
product.category === selectedCategory;

return nameMatch && categoryMatch;

});


filtered.forEach(product => {

let photos = "";


product.images.forEach(image => {

photos += `

<img
src="${image}"
alt="${product.name}">

`;

});


let sizes = "";

product.sizes.forEach(size => {

sizes += `

<option value="${size}">
${size}
</option>

`;

});


container.innerHTML += `

<div class="product">

<div class="gallery">

<div class="gallery-track">

${photos}

</div>

<div class="photo-count">

${product.images.length} photo(s)

</div>

</div>


<div class="product-info">

<h3>
${product.name}
</h3>

<p>
${product.description || ""}
</p>

<div class="price">
₹${product.price}
</div>


<select
class="size"
id="size-${product.id}">

${sizes}

</select>


<button
class="add"
onclick="addToCart(${product.id})">

ADD TO CART

</button>

</div>

</div>

`;

});

}


function addToCart(id) {

const product =
products.find(p => p.id === id);

const size =
document.getElementById(
"size-" + id
).value;


const existing =
cart.find(item =>
item.id === id &&
item.size === size
);


if (existing) {

existing.quantity++;

} else {

cart.push({

id: product.id,

name: product.name,

price: product.price,

size: size,

quantity: 1

});

}


updateCart();

alert(
product.name +
" (" +
size +
") added to cart"
);

}


function changeQuantity(
index,
amount
) {

cart[index].quantity += amount;


if (cart[index].quantity <= 0) {

cart.splice(index, 1);

}


updateCart();

}


function removeItem(index) {

cart.splice(index, 1);

updateCart();

}


function updateCart() {

const container =
document.getElementById("cart-items");

container.innerHTML = "";

let total = 0;

let count = 0;


cart.forEach((item, index) => {

const subtotal =
item.price *
item.quantity;

total += subtotal;

count += item.quantity;


container.innerHTML += `

<div class="cart-item">

<strong>
${item.name}
</strong>

<br>

Size: ${item.size}

<br>

₹${item.price}

<div>

<button
onclick="changeQuantity(${index}, -1)">
−
</button>

${item.quantity}

<button
onclick="changeQuantity(${index}, 1)">
+
</button>

<button
onclick="removeItem(${index})">
Remove
</button>

</div>

</div>

`;

});


document.getElementById("total")
.innerText = total;

document.getElementById("cart-count")
.innerText = count;

}


function toggleCart() {

document
.getElementById("cart")
.classList.toggle("show");

}

async function orderWhatsApp() {

    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    const name = document
        .getElementById("customer-name")
        .value
        .trim();

    const phone = document
        .getElementById("customer-phone")
        .value
        .trim();

    const address = document
        .getElementById("customer-address")
        .value
        .trim();

    if (!name || !phone || !address) {
        alert(
            "Please enter your name, phone number and address."
        );
        return;
    }

    let total = 0;
    let totalQuantity = 0;
    let orderItems = "";

    cart.forEach(item => {

        const subtotal =
            item.price * item.quantity;

        total += subtotal;
        totalQuantity += item.quantity;

        orderItems +=
            item.name +
            " | Size: " +
            item.size +
            " | Qty: " +
            item.quantity +
            " | ₹" +
            subtotal +
            "\n";
    });

    const orderData =
        new URLSearchParams();

    orderData.append(
        "customer_name",
        name
    );

    orderData.append(
        "phone",
        phone
    );

    orderData.append(
        "address",
        address
    );

    orderData.append(
        "product_name",
        orderItems.trim()
    );

    orderData.append(
        "size",
        "Multiple"
    );

    orderData.append(
        "quantity",
        totalQuantity
    );

    orderData.append(
        "total",
        total
    );


    try {

        const response = await fetch(
            "/order",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: orderData.toString()
            }
        );

        if (!response.ok) {
            throw new Error(
                "Order could not be saved."
            );
        }

    } catch (error) {

        alert(
            "Could not save your order. Please try again."
        );

        return;
    }


    let message =
        "Hello SRK Men's Clothing!%0A%0A";

    message +=
        "*New Order*%0A%0A";

    message +=
        "*Customer:* " +
        encodeURIComponent(name) +
        "%0A";

    message +=
        "*Phone:* " +
        encodeURIComponent(phone) +
        "%0A";

    message +=
        "*Address:* " +
        encodeURIComponent(address) +
        "%0A%0A";

    message +=
        "*Products:*%0A";

    cart.forEach(item => {

        const subtotal =
            item.price * item.quantity;

        message +=
            encodeURIComponent(
                item.name +
                " | Size: " +
                item.size +
                " | Qty: " +
                item.quantity +
                " | ₹" +
                subtotal
            ) +
            "%0A";
    });

    message +=
        "%0A*Total: ₹" +
        total +
        "*";


    const whatsapp =
        "919620030375";

    window.location.href =
        "https://wa.me/" +
        whatsapp +
        "?text=" +
        message;
}

displayProducts();

</script>

</body>

</html>
