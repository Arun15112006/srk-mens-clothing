<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>SRK Admin Login</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box {
    background: white;
    color: #111;
    width: 90%;
    max-width: 380px;
    padding: 30px;
    border-radius: 15px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 13px;
    background: #111;
    color: white;
    border: 0;
    margin-top: 10px;
}

.error {
    color: red;
}

</style>

</head>

<body>

<div class="box">

<h1>SRK</h1>

<h2>Admin Login</h2>

{% with messages = get_flashed_messages() %}

{% for message in messages %}

<p class="error">{{ message }}</p>

{% endfor %}

{% endwith %}

<form method="POST">

<input
name="username"
placeholder="Username"
required>

<input
name="password"
type="password"
placeholder="Password"
required>

<button type="submit">
LOGIN
</button>

</form>

</div>

</body>

</html>
